[package]
name = "selah"
version = "0.29.4"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "AI-native screenshot capture, annotation, and redaction library for AGNOS"
repository = "https://github.com/MacCracken/selah"
readme = "README.md"
documentation = "https://docs.rs/selah"
keywords = ["screenshot", "annotation", "redaction", "mcp", "agnos"]
categories = ["multimedia::images"]
exclude = [".claude/", ".github/", "docs/", "scripts/", "crates/"]

[lib]
name = "selah"
path = "src/lib.rs"

[dependencies]
hisab = { version = "1.4", default-features = false, features = ["geo", "num", "transforms"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
# Only the codecs selah supports (see `ImageFormat`): keeps exotic decoders off the
# untrusted-input path and the dependency tree small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
ranga = "1"
base64 = "0.23"
tokio = { version = "1.54", features = ["rt"], optional = true }
bote = { version = "0.92", optional = true }

[features]
default = []
mcp = ["dep:bote", "dep:tokio"]
# Reserved for hoosh-backed AI features; currently enables nothing.
ai = []

[dev-dependencies]
bote = "0.92"
tokio = { version = "1.54", features = ["rt", "macros"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

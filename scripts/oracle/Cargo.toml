[package]
name = "selah-oracle"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false
description = "Drives the frozen Rust selah 0.30.0 in rust-old/ to write the Cyrius port's golden corpus"

# The oracle is used by path and never built or edited in place (CLAUDE.md: do not modify rust-old/).
# Cargo.lock was seeded from rust-old/Cargo.lock, so every shared dependency resolves to the version
# the oracle was released and tested with; the codec crates are pinned exactly to say so.
[dependencies]
selah = { path = "../../rust-old", features = ["mcp"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
png = "=0.18.1"
flate2 = "=1.1.11"
# Fixture producer only (never on the oracle's path): JPEG chroma subsampling, progressive, restart
# intervals and CMYK, which `image`'s own JPEG encoder cannot write.
jpeg-encoder = "=0.6.1"
# M1: the serde shapes selah writes and reads, at the oracle's versions.
serde = "=1.0.229"
serde_json = "=1.0.154"
uuid = "=1.29.2"
# M4: decode_image_data's inputs are encoded with the base64 selah 0.30.0 decodes with.
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
# M5: the capture and hoosh clients are async; the oracle drives them on a current-thread runtime.
tokio = { version = "=1.54.1", features = ["rt"] }

[[bin]]
name = "oracle"
path = "src/main.rs"

[profile.release]
# Correctness, not speed: keep overflow checks so a bad fixture size fails loudly.
overflow-checks = true
